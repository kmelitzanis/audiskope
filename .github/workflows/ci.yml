name: Desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make curl tar xz
      - name: Build LGPL audio tools (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/build-audio.sh
      - name: Build LGPL audio tools (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-audio.sh
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test:unit
      - run: pnpm run test:release
      - run: pnpm run test:native
      - run: pnpm run licenses
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-notices-${{ matrix.os }}
          path: third-party/
